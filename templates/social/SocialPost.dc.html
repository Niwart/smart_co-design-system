</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;all&quot;,&quot;new-joiner&quot;,&quot;we-are-hiring&quot;,&quot;empty&quot;],&quot;default&quot;:&quot;all&quot;,&quot;tsType&quot;:&quot;'all'|'new-joiner'|'we-are-hiring'|'empty'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant ?? 'all';
    return {
      showJoiner: v === 'all' || v === 'new-joiner',
      showHiring: v === 'all' || v === 'we-are-hiring',
      showEmpty: v === 'all' || v === 'empty'
    };
  }
}
</script>
</body>

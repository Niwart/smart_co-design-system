<!-- @dsCard group="Spacing" viewport="700x300" name="Spacing in use" subtitle="Eyebrow → headline → body → number rhythm" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;box-sizing:border-box;min-height:300px}*{box-sizing:border-box}.m{font:var(--type-caption);letter-spacing:var(--ls-caption);color:var(--text-caption)}.row{display:flex;gap:16px}.col{display:flex;flex-direction:column;gap:6px}</style></head><body><div style="display:grid;grid-template-columns:1.4fr 1fr;gap:var(--space-7);align-items:end"><div class="col" style="gap:0"><div style="font:var(--type-eyebrow);text-transform:uppercase;color:var(--text-body);margin-bottom:var(--space-2)">Case study</div><div style="font:var(--type-h1);color:var(--text-heading);margin-bottom:var(--space-4)">Fewer tools, <span style="color:var(--text-highlight)">faster answers</span></div><p style="font:var(--type-body);color:var(--text-body)">One team replaced four dashboards with a single view. Reporting time fell each month.</p></div><div style="border-top:1px solid var(--border-default);padding-top:var(--space-4)"><div style="font:var(--type-number);letter-spacing:var(--ls-number);color:var(--text-number-accent-1)">−62%</div><div class="m" style="margin-top:var(--space-2)">Time spent on reporting</div></div></div><div class="m" style="margin-top:var(--space-6)">space-2 · space-4 · space-7 between columns</div></body></html>
